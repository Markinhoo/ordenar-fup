<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activar administrador · Ordenar FUP</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#173727;background:#edf4ee}*{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px}
    main{width:min(100%,460px);background:white;border:1px solid #d5e2d7;border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 40px #17372712}
    h1{font-size:1.5rem;margin:.3rem 0}.muted{color:#53685a;line-height:1.45}
    form{display:grid;gap:12px;margin-top:20px}label{display:grid;gap:6px;font-weight:650;font-size:.9rem}
    input{width:100%;border:1px solid #b8cbbc;border-radius:10px;padding:12px;font:inherit}
    button{border:0;border-radius:10px;padding:12px 16px;background:#315e48;color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}a{color:#315e48}#message{min-height:1.5em;color:#ae3227}#message.ok{color:#216b3d}
    @media(max-height:650px){body{place-items:start center}main{padding:18px}form{gap:8px;margin-top:10px}}
  </style>
</head>
<body>
  <main>
    <small>ORDENAR FUP · ACCESO INICIAL</small>
    <h1>Activa la cuenta administradora</h1>
    <p class="muted">Cuenta: <strong>nomina@fup.com</strong>. Define tu contraseña y una pregunta que solo tú puedas responder. Este enlace vence en 24 horas y funciona una vez.</p>
    <form id="activateForm">
      <label>Contraseña<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
      <label>Pregunta de respaldo<input id="question" minlength="10" maxlength="160" placeholder="Una pregunta que solo tú sepas responder" required></label>
      <label>Respuesta de respaldo<input id="answer" type="password" autocomplete="off" minlength="8" maxlength="160" required></label>
      <button id="submit" type="submit">Activar mi cuenta</button>
    </form>
    <p id="message" role="status"></p>
    <a href="./control.html">Volver al acceso</a>
  </main>
  <script src="./shared-config.js"></script>
  <script>
    const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
    history.replaceState(null, '', location.pathname);
    const form = document.getElementById('activateForm');
    const message = document.getElementById('message');
    if (!/^[a-f0-9]{64}$/.test(token)) {
      form.hidden = true;
      message.textContent = 'Enlace de activación inválido. Solicita uno nuevo a la persona encargada.';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('submit');
      button.disabled = true; message.textContent = '';
      try {
        const response = await fetch(`${window.FUP_SUPABASE.url}/functions/v1/fup-accounts`, {
          method: 'POST', cache: 'no-store',
          headers: { apikey: window.FUP_SUPABASE.key, Authorization: `Bearer ${window.FUP_SUPABASE.key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'activate-admin', token,
            password: document.getElementById('password').value,
            question: document.getElementById('question').value,
            answer: document.getElementById('answer').value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'No se pudo activar la cuenta');
        form.hidden = true; message.classList.add('ok');
        message.innerHTML = 'Cuenta activada. <a href="./control.html">Inicia sesión aquí</a>.';
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
